name: Update contribution graph

# Redraws the animated contribution graph once a day from the public calendar.
# Runs on GitHub's servers. No tokens beyond the built-in one, no third-party services.

on:
  schedule:
    - cron: "0 2 * * *"   # 06:00 UAE time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redraw the graph
        run: python3 scripts/update_activity.py
      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Update contribution graph"
            git push
          else
            echo "No change."
          fi
