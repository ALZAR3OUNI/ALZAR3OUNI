<svg xmlns="http://www.w3.org/2000/svg" width="860" height="298" viewBox="0 0 860 298" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1626"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="clip"><rect x="1" y="1" width="858" height="296" rx="18"/></clipPath>

</defs>
<style>
.t{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3} .m{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#8b98ad} .k{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace;fill:#7aa2f7}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(40px,14px)}100%{transform:translate(0,0)}}
@keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-46px,-10px)}100%{transform:translate(0,0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.g1{animation:drift 14s ease-in-out infinite} .g2{animation:drift2 17s ease-in-out infinite}
.r{animation:rise .7s ease-out both} .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.cur{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.g1,.g2,.r,.bar,.cur{animation:none}}
</style>
<rect x="1" y="1" width="858" height="296" rx="18" fill="url(#bg)"/>
<g clip-path="url(#clip)" filter="url(#blur)" opacity=".55">
<circle class="g1" cx="138" cy="30" r="120" fill="#0ea5e9"/>
<circle class="g2" cx="740" cy="283" r="130" fill="#6d28d9"/>
<circle class="g1" cx="533" cy="-60" r="90" fill="#2563eb"/>
</g>
<rect x="14" y="14" width="832" height="270" rx="12" fill="#0b0f17" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="1" y="1" width="858" height="296" rx="18" fill="none" stroke="#2a3550"/>
<text class="t" x="34" y="52" font-size="19" font-weight="700">Language Stack</text><text class="k" x="826" y="50" font-size="12" text-anchor="end">&gt; stack.scan<tspan class="cur"> _</tspan></text><text class="m" x="34" y="72" font-size="12">Weighted by code across my repositories</text><g class="r" style="animation-delay:0.00s"><circle cx="40" cy="96" r="4.5" fill="#3572A5"/><text class="t" x="54" y="100" font-size="13" font-weight="600">Python</text><text class="m" x="230" y="100" font-size="12" text-anchor="end">82.8%</text><rect x="246" y="91" width="580" height="7" rx="3.5" fill="#1b2334"/><rect class="bar" style="animation-delay:0.25s" x="246" y="91" width="580" height="7" rx="3.5" fill="#3572A5"/></g><g class="r" style="animation-delay:0.10s"><circle cx="40" cy="126" r="4.5" fill="#f1e05a"/><text class="t" x="54" y="130" font-size="13" font-weight="600">JavaScript</text><text class="m" x="230" y="130" font-size="12" text-anchor="end">11.5%</text><rect x="246" y="121" width="580" height="7" rx="3.5" fill="#1b2334"/><rect class="bar" style="animation-delay:0.35s" x="246" y="121" width="81" height="7" rx="3.5" fill="#f1e05a"/></g><g class="r" style="animation-delay:0.20s"><circle cx="40" cy="156" r="4.5" fill="#c6538c"/><text class="t" x="54" y="160" font-size="13" font-weight="600">SCSS</text><text class="m" x="230" y="160" font-size="12" text-anchor="end">3.2%</text><rect x="246" y="151" width="580" height="7" rx="3.5" fill="#1b2334"/><rect class="bar" style="animation-delay:0.45s" x="246" y="151" width="22" height="7" rx="3.5" fill="#c6538c"/></g><g class="r" style="animation-delay:0.30s"><circle cx="40" cy="186" r="4.5" fill="#00B4AB"/><text class="t" x="54" y="190" font-size="13" font-weight="600">Dart</text><text class="m" x="230" y="190" font-size="12" text-anchor="end">1.5%</text><rect x="246" y="181" width="580" height="7" rx="3.5" fill="#1b2334"/><rect class="bar" style="animation-delay:0.55s" x="246" y="181" width="11" height="7" rx="3.5" fill="#00B4AB"/></g><g class="r" style="animation-delay:0.40s"><circle cx="40" cy="216" r="4.5" fill="#8b5cf6"/><text class="t" x="54" y="220" font-size="13" font-weight="600">CSS</text><text class="m" x="230" y="220" font-size="12" text-anchor="end">0.9%</text><rect x="246" y="211" width="580" height="7" rx="3.5" fill="#1b2334"/><rect class="bar" style="animation-delay:0.65s" x="246" y="211" width="8" height="7" rx="3.5" fill="#8b5cf6"/></g><g class="r" style="animation-delay:0.50s"><circle cx="40" cy="246" r="4.5" fill="#e34c26"/><text class="t" x="54" y="250" font-size="13" font-weight="600">HTML</text><text class="m" x="230" y="250" font-size="12" text-anchor="end">0.1%</text><rect x="246" y="241" width="580" height="7" rx="3.5" fill="#1b2334"/><rect class="bar" style="animation-delay:0.75s" x="246" y="241" width="8" height="7" rx="3.5" fill="#e34c26"/></g>
</svg>