<svg xmlns="http://www.w3.org/2000/svg" width="860" height="206" viewBox="0 0 860 206" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1626"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="clip"><rect x="1" y="1" width="858" height="204" rx="18"/></clipPath>

</defs>
<style>
.t{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3} .m{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#8b98ad} .k{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace;fill:#7aa2f7}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(40px,14px)}100%{transform:translate(0,0)}}
@keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-46px,-10px)}100%{transform:translate(0,0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.g1{animation:drift 14s ease-in-out infinite} .g2{animation:drift2 17s ease-in-out infinite}
.r{animation:rise .7s ease-out both} .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.cur{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.g1,.g2,.r,.bar,.cur{animation:none}}
</style>
<rect x="1" y="1" width="858" height="204" rx="18" fill="url(#bg)"/>
<g clip-path="url(#clip)" filter="url(#blur)" opacity=".55">
<circle class="g1" cx="138" cy="21" r="120" fill="#2563eb"/>
<circle class="g2" cx="740" cy="196" r="130" fill="#7c3aed"/>
<circle class="g1" cx="533" cy="-41" r="90" fill="#0d9488"/>
</g>
<rect x="14" y="14" width="832" height="178" rx="12" fill="#0b0f17" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="1" y="1" width="858" height="204" rx="18" fill="none" stroke="#2a3550"/>
<text class="t" x="34" y="52" font-size="19" font-weight="700">Profile Signal</text><text class="k" x="826" y="50" font-size="12" text-anchor="end">&gt; signal.scan<tspan class="cur"> _</tspan></text><text class="m" x="34" y="72" font-size="12">Live numbers from GitHub, private work included</text><g class="r" style="animation-delay:0.00s"><rect x="34" y="90" width="188" height="92" rx="10" fill="#111827" stroke="#263249"/><text class="m" x="48" y="113" font-size="11" letter-spacing=".6">CONTRIBUTIONS</text><text class="t" x="48" y="147" font-size="28" font-weight="700" fill="#7aa2f7"><!--total-->854<!--/total--></text><text class="m" x="48" y="164" font-size="10.5">last 12 months</text><rect x="48" y="171" width="160" height="3" rx="1.5" fill="#1f2937"/><rect class="bar" style="animation-delay:0.30s" x="48" y="171" width="135" height="3" rx="1.5" fill="#7aa2f7"/></g><g class="r" style="animation-delay:0.12s"><rect x="235" y="90" width="188" height="92" rx="10" fill="#111827" stroke="#263249"/><text class="m" x="249" y="113" font-size="11" letter-spacing=".6">ACTIVE DAYS</text><text class="t" x="249" y="147" font-size="28" font-weight="700" fill="#34d399"><!--active-->134<!--/active--></text><text class="m" x="249" y="164" font-size="10.5">days with commits</text><rect x="249" y="171" width="160" height="3" rx="1.5" fill="#1f2937"/><rect class="bar" style="animation-delay:0.42s" x="249" y="171" width="57" height="3" rx="1.5" fill="#34d399"/></g><g class="r" style="animation-delay:0.24s"><rect x="436" y="90" width="188" height="92" rx="10" fill="#111827" stroke="#263249"/><text class="m" x="450" y="113" font-size="11" letter-spacing=".6">LONGEST STREAK</text><text class="t" x="450" y="147" font-size="28" font-weight="700" fill="#c084fc"><!--streak-->27<!--/streak--></text><text class="m" x="450" y="164" font-size="10.5">days in a row</text><rect x="450" y="171" width="160" height="3" rx="1.5" fill="#1f2937"/><rect class="bar" style="animation-delay:0.54s" x="450" y="171" width="72" height="3" rx="1.5" fill="#c084fc"/></g><g class="r" style="animation-delay:0.36s"><rect x="637" y="90" width="188" height="92" rx="10" fill="#111827" stroke="#263249"/><text class="m" x="651" y="113" font-size="11" letter-spacing=".6">REPOSITORIES</text><text class="t" x="651" y="147" font-size="28" font-weight="700" fill="#fbbf24">5</text><text class="m" x="651" y="164" font-size="10.5">mostly private</text><rect x="651" y="171" width="160" height="3" rx="1.5" fill="#1f2937"/><rect class="bar" style="animation-delay:0.66s" x="651" y="171" width="67" height="3" rx="1.5" fill="#fbbf24"/></g>
</svg>