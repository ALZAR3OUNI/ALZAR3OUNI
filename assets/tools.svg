<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1626"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="clip"><rect x="1" y="1" width="858" height="198" rx="18"/></clipPath>

</defs>
<style>
.t{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3} .m{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#8b98ad} .k{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace;fill:#7aa2f7}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(40px,14px)}100%{transform:translate(0,0)}}
@keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-46px,-10px)}100%{transform:translate(0,0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.g1{animation:drift 14s ease-in-out infinite} .g2{animation:drift2 17s ease-in-out infinite}
.r{animation:rise .7s ease-out both} .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.cur{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.g1,.g2,.r,.bar,.cur{animation:none}}
</style>
<rect x="1" y="1" width="858" height="198" rx="18" fill="url(#bg)"/>
<g clip-path="url(#clip)" filter="url(#blur)" opacity=".55">
<circle class="g1" cx="138" cy="20" r="120" fill="#2563eb"/>
<circle class="g2" cx="740" cy="190" r="130" fill="#0d9488"/>
<circle class="g1" cx="533" cy="-40" r="90" fill="#7c3aed"/>
</g>
<rect x="14" y="14" width="832" height="172" rx="12" fill="#0b0f17" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="1" y="1" width="858" height="198" rx="18" fill="none" stroke="#2a3550"/>
<text class="m" x="34" y="48" font-size="11" letter-spacing="1.2">LANGUAGES</text><g class="r" style="animation-delay:0.00s"><rect x="190" y="31" width="81" height="26" rx="13" fill="#111827" stroke="#7aa2f7" stroke-opacity=".55"/><circle cx="203" cy="44" r="3" fill="#7aa2f7"/><text class="t" x="212" y="48" font-size="12.5" font-weight="600">Python</text></g><g class="r" style="animation-delay:0.06s"><rect x="281" y="31" width="113" height="26" rx="13" fill="#111827" stroke="#7aa2f7" stroke-opacity=".55"/><circle cx="294" cy="44" r="3" fill="#7aa2f7"/><text class="t" x="303" y="48" font-size="12.5" font-weight="600">JavaScript</text></g><g class="r" style="animation-delay:0.12s"><rect x="404" y="31" width="66" height="26" rx="13" fill="#111827" stroke="#7aa2f7" stroke-opacity=".55"/><circle cx="417" cy="44" r="3" fill="#7aa2f7"/><text class="t" x="426" y="48" font-size="12.5" font-weight="600">Dart</text></g><g class="r" style="animation-delay:0.18s"><rect x="480" y="31" width="58" height="26" rx="13" fill="#111827" stroke="#7aa2f7" stroke-opacity=".55"/><circle cx="493" cy="44" r="3" fill="#7aa2f7"/><text class="t" x="502" y="48" font-size="12.5" font-weight="600">SQL</text></g><text class="m" x="34" y="88" font-size="11" letter-spacing="1.2">ODOO</text><g class="r" style="animation-delay:0.18s"><rect x="190" y="71" width="58" height="26" rx="13" fill="#111827" stroke="#c084fc" stroke-opacity=".55"/><circle cx="203" cy="84" r="3" fill="#c084fc"/><text class="t" x="212" y="88" font-size="12.5" font-weight="600">ORM</text></g><g class="r" style="animation-delay:0.24s"><rect x="258" y="71" width="66" height="26" rx="13" fill="#111827" stroke="#c084fc" stroke-opacity=".55"/><circle cx="271" cy="84" r="3" fill="#c084fc"/><text class="t" x="280" y="88" font-size="12.5" font-weight="600">QWeb</text></g><g class="r" style="animation-delay:0.30s"><rect x="333" y="71" width="58" height="26" rx="13" fill="#111827" stroke="#c084fc" stroke-opacity=".55"/><circle cx="346" cy="84" r="3" fill="#c084fc"/><text class="t" x="355" y="88" font-size="12.5" font-weight="600">OWL</text></g><text class="m" x="34" y="128" font-size="11" letter-spacing="1.2">DATA AND MOBILE</text><g class="r" style="animation-delay:0.36s"><rect x="190" y="111" width="113" height="26" rx="13" fill="#111827" stroke="#34d399" stroke-opacity=".55"/><circle cx="203" cy="124" r="3" fill="#34d399"/><text class="t" x="212" y="128" font-size="12.5" font-weight="600">PostgreSQL</text></g><g class="r" style="animation-delay:0.42s"><rect x="313" y="111" width="89" height="26" rx="13" fill="#111827" stroke="#34d399" stroke-opacity=".55"/><circle cx="326" cy="124" r="3" fill="#34d399"/><text class="t" x="335" y="128" font-size="12.5" font-weight="600">Flutter</text></g><text class="m" x="34" y="168" font-size="11" letter-spacing="1.2">TOOLS</text><g class="r" style="animation-delay:0.54s"><rect x="190" y="151" width="152" height="26" rx="13" fill="#111827" stroke="#fbbf24" stroke-opacity=".55"/><circle cx="203" cy="164" r="3" fill="#fbbf24"/><text class="t" x="212" y="168" font-size="12.5" font-weight="600">REST / JSON-RPC</text></g><g class="r" style="animation-delay:0.60s"><rect x="352" y="151" width="58" height="26" rx="13" fill="#111827" stroke="#fbbf24" stroke-opacity=".55"/><circle cx="366" cy="164" r="3" fill="#fbbf24"/><text class="t" x="374" y="168" font-size="12.5" font-weight="600">Git</text></g>
</svg>