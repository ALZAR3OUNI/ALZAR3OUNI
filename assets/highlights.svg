<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f1626"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="clip"><rect x="1" y="1" width="858" height="168" rx="18"/></clipPath>

</defs>
<style>
.t{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#e6edf3} .m{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#8b98ad} .k{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',Menlo,monospace;fill:#7aa2f7}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(40px,14px)}100%{transform:translate(0,0)}}
@keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-46px,-10px)}100%{transform:translate(0,0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.g1{animation:drift 14s ease-in-out infinite} .g2{animation:drift2 17s ease-in-out infinite}
.r{animation:rise .7s ease-out both} .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.cur{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.g1,.g2,.r,.bar,.cur{animation:none}}
</style>
<rect x="1" y="1" width="858" height="168" rx="18" fill="url(#bg)"/>
<g clip-path="url(#clip)" filter="url(#blur)" opacity=".55">
<circle class="g1" cx="138" cy="17" r="120" fill="#0d9488"/>
<circle class="g2" cx="740" cy="162" r="130" fill="#7c3aed"/>
<circle class="g1" cx="533" cy="-34" r="90" fill="#f59e0b"/>
</g>
<rect x="14" y="14" width="832" height="142" rx="12" fill="#0b0f17" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
<rect x="1" y="1" width="858" height="168" rx="18" fill="none" stroke="#2a3550"/>
<text class="m" x="34" y="48" font-size="11" letter-spacing="3">HIGHLIGHTS</text><g class="r" style="animation-delay:0.00s"><rect x="34" y="62" width="255" height="84" rx="10" fill="#111827" stroke="#263249"/><rect x="34" y="74" width="3" height="60" rx="1.5" fill="#fbbf24"/><text class="m" x="50" y="86" font-size="11" letter-spacing=".6">HACKATHON</text><text class="t" x="50" y="112" font-size="19" font-weight="700">2nd place</text><text class="m" x="50" y="132" font-size="11">Odoo Annual Hackathon, Nov 2026</text></g><g class="r" style="animation-delay:0.14s"><rect x="302" y="62" width="255" height="84" rx="10" fill="#111827" stroke="#263249"/><rect x="302" y="74" width="3" height="60" rx="1.5" fill="#34d399"/><text class="m" x="318" y="86" font-size="11" letter-spacing=".6">RETAIL SYSTEMS</text><text class="t" x="318" y="112" font-size="19" font-weight="700">80 modules</text><text class="m" x="318" y="132" font-size="11">custom Odoo 17, live in production</text></g><g class="r" style="animation-delay:0.28s"><rect x="571" y="62" width="255" height="84" rx="10" fill="#111827" stroke="#263249"/><rect x="571" y="74" width="3" height="60" rx="1.5" fill="#c084fc"/><text class="m" x="587" y="86" font-size="11" letter-spacing=".6">LOCAL AI</text><text class="t" x="587" y="112" font-size="19" font-weight="700">No cloud API</text><text class="m" x="587" y="132" font-size="11">LightGBM, Whisper and Kokoro on CPU</text></g>
</svg>